[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtengine"
version = "0.1.0"
description = "Engine for computational experiments in mathematics, especially topology and geometry: one interface (Python API, CLI, MCP server) to Macaulay2, gfan, polymake, Singular, nauty, Lean/Mathlib and Regina, with provenance"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mte = "mtengine.cli:main"
mtengine-mcp = "mtengine.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes more than a few seconds"]
